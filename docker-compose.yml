version: "3.9"
services:
  mcp:
    build: ./mcp_server
    ports:
      - "8100:8100"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8100"

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
